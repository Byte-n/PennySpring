name: Android Release

# 发布方式：在 main 上提交一条形如 `update: v1.0.3` 的记录（同时把 version 与
# android/version.json 改到同一版本），工作流自动构建 APK、生成更新清单、
# 创建 Release 并打 tag。也可以在 Actions 页面手动指定版本重跑。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 1.0.3，需与仓库 version 文件一致）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'update: v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        env:
          # 事件载荷一律经环境变量传递，不直接拼进脚本
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION_NAME="$INPUT_VERSION"
          else
            VERSION_NAME="$(git log -1 --pretty=%B | node scripts/android/version.js from-commit)"
          fi

          # version / android/version.json 必须与提交记录一致，不一致直接失败
          node scripts/android/version.js assert "$VERSION_NAME" > /dev/null
          # 以公式重算 versionCode，保证同版本名在任何机器上产出同一个 code
          node scripts/android/version.js set "$VERSION_NAME" > /dev/null

          VERSION_CODE="$(node -p "require('./android/version.json').versionCode")"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: 检查是否已发布过
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/v$VERSION_NAME" > /dev/null; then
            echo "::error::标签 v$VERSION_NAME 已存在，请使用新版本号或先删除旧 Release"
            exit 1
          fi

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: false

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装依赖
        run: yarn install --frozen-lockfile

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: 构建 Release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_PENNYSPRING_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_PENNYSPRING_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PENNYSPRING_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PENNYSPRING_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 整理产物与发布说明
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p build/release
          cp android/app/build/outputs/apk/release/app-release.apk \
            "build/release/PennySpring-$VERSION_NAME.apk"
          # 提交信息首行是 update 标记，其余行作为更新说明
          git log -1 --pretty=%B | tail -n +2 | sed '/^[[:space:]]*$/d' > build/release/notes.md
          if [ ! -s build/release/notes.md ]; then
            echo "PennySpring $VERSION_NAME" > build/release/notes.md
          fi

      - name: 生成更新清单
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PennySpring-${VERSION_NAME}.apk"
          node scripts/android/make-manifest.js \
            --apk "build/release/PennySpring-${VERSION_NAME}.apk" \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --url "$APK_URL" \
            --notes-file build/release/notes.md \
            --out build/release/latest.json

      - name: 归档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pennyspring-v${{ steps.version.outputs.name }}
          path: build/release/
          retention-days: 14

      - name: 创建 Release 并打标签
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "build/release/PennySpring-${VERSION_NAME}.apk#PennySpring-${VERSION_NAME}.apk" \
            "build/release/latest.json#latest.json" \
            --target "$GITHUB_SHA" \
            --title "PennySpring $VERSION_NAME" \
            --notes-file build/release/notes.md

      - name: 写入任务摘要
        if: success()
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Android 发布完成"
            echo "- 版本：${VERSION_NAME}（versionCode ${VERSION_CODE}）"
            echo "- 下载：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- 更新清单：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
